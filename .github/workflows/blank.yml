name: Build NovaShield VPN

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This action provisions Android command-line tools and adds sdkmanager to PATH.
      # Do not add a packages input; legacy Android components are excluded.
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaShieldVPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
